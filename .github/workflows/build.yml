name: Build

on:
  push:
    branches: [main, ProjectRestructuring]
  pull_request:
    branches: [main, ProjectRestructuring]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wxWidgets (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwxgtk3.2-dev

      - name: Install wxWidgets (macOS)
        if: runner.os == 'macOS'
        run: brew install wxwidgets

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Compile and link (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p obj
          find UseCases Infrastructure -name '*.cpp' | while read -r file; do
            echo "Compiling $file"
            g++ -std=c++17 -c "$file" $(wx-config --cxxflags) -o "obj/$(basename "${file%.cpp}").o"
          done

          for file in UI/src/*.cpp; do
            echo "Compiling $file"
            g++ -std=c++17 -c "$file" -IUI/include $(wx-config --cxxflags) -o "obj/$(basename "${file%.cpp}").o"
          done
          g++ obj/app.o obj/mainframe.o obj/card_dialog.o obj/card_list_panel.o obj/deck_panel.o $(wx-config --libs) -o CourseTracker

      - name: Compile and link (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p obj
          find UseCases Infrastructure -name '*.cpp' | while read -r file; do
            echo "Compiling $file"
            g++ -std=c++17 -c "$file" $(wx-config --cxxflags) -o "obj/$(basename "${file%.cpp}").o"
          done

          for file in UI/src/*.cpp; do
            echo "Compiling $file"
            g++ -std=c++17 -c "$file" -IUI/include $(wx-config --cxxflags) -o "obj/$(basename "${file%.cpp}").o"
          done
          g++ obj/app.o obj/mainframe.o obj/card_dialog.o obj/card_list_panel.o obj/deck_panel.o $(wx-config --libs) -o CourseTracker.exe
